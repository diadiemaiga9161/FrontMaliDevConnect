<div class="admin-shell" [class.sidebar-collapsed]="!sidebarOpen" [class.sidebar-open]="sidebarOpen">

  <!-- Overlay mobile -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>

  <!-- ══ SIDEBAR ══ -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <i class="fa fa-shield brand-icon"></i>
      <span class="brand-text">Admin Panel</span>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="active"
         class="sidebar-link">
        <i class="fa {{item.icon}}"></i>
        <span>{{item.label}}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-info" [routerLink]="'/admin/mon-profil'" style="cursor:pointer;" title="Mon Profil">
        <div class="admin-avatar">
          <i class="fa fa-user-circle"></i>
        </div>
        <div class="admin-meta">
          <span class="admin-name">{{admin?.prenom}} {{admin?.nom}}</span>
          <span class="admin-role">
            {{ (admin?.roles || []).includes('ROLE_SUPERADMIN') ? 'Super Admin' : 'Administrateur' }}
          </span>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()" title="Déconnexion">
        <i class="fa fa-sign-out"></i>
      </button>
    </div>
  </aside>

  <!-- ══ MAIN ══ -->
  <div class="admin-main">
    <!-- Top bar -->
    <header class="admin-topbar">
      <button class="btn-toggle-sidebar" (click)="toggleSidebar()">
        <i class="fa fa-bars"></i>
      </button>
      <div class="topbar-title">
        <i class="fa fa-shield me-2 text-primary"></i>
        <strong>DevMaliConnect</strong>
        <span class="topbar-subtitle ms-2 text-muted" style="font-size:.85rem;">— Espace Administration</span>
      </div>
      <div class="topbar-actions">
        <a routerLink="/profil-client" class="btn-back-site" style="background:#f1f5f9;color:#374151;margin-right:.5rem;">
          <i class="fa fa-user"></i><span class="btn-label ms-1"> Mon profil</span>
        </a>
        <a routerLink="/" class="btn-back-site">
          <i class="fa fa-globe"></i><span class="btn-label ms-1"> Voir le site</span>
        </a>
      </div>
    </header>

    <!-- Page content -->
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
