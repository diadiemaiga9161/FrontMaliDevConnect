<body class="bg-maiga">
<div class="container" style="justify-content: center; background-size: cover; padding-top: 50px; padding-bottom: 50px;">
    <div class="row mb-5 py-3" style="justify-content: center;">
        <form class="form" (ngSubmit)="resetPassword(email)">
            <p style="text-align: center; font-size: 1.1rem; font-weight: 700; color: #1e293b;">
                Mot de passe oublié
            </p>
            <p style="text-align: center; font-size: 12px; color: #64748b; margin-bottom: 20px;">
                Entrez votre email et nous vous enverrons un lien pour réinitialiser votre mot de passe.
            </p>

            <div class="flex-column">
                <label>Email</label>
            </div>
            <div class="inputForm">
                <svg height="20" viewBox="0 0 32 32" width="20" xmlns="http://www.w3.org/2000/svg">
                    <g id="Layer_3" data-name="Layer 3">
                        <path d="m30.853 13.87a15 15 0 0 0 -29.729 4.082 15.1 15.1 0 0 0 12.876 12.918 15.6 15.6 0 0 0 2.016.13 14.85 14.85 0 0 0 7.715-2.145 1 1 0 1 0 -1.031-1.711 13.007 13.007 0 1 1 5.458-6.529 2.149 2.149 0 0 1 -4.158-.759v-10.856a1 1 0 0 0 -2 0v1.726a8 8 0 1 0 .2 10.325 4.135 4.135 0 0 0 7.83.274 15.2 15.2 0 0 0 .823-7.455zm-14.853 8.13a6 6 0 1 1 6-6 6.006 6.006 0 0 1 -6 6z"></path>
                    </g>
                </svg>
                <input type="email"
                       [(ngModel)]="email"
                       name="email"
                       class="input"
                       placeholder="Votre adresse email"
                       required>
            </div>

            <button type="submit" class="button-submit" [disabled]="loading"
                    [style.opacity]="loading ? '0.7' : '1'">
                <span *ngIf="!loading">
                    <i class="fa fa-paper-plane me-2"></i>Envoyer le lien
                </span>
                <span *ngIf="loading">
                    <i class="fa fa-spinner fa-spin me-2"></i>Envoi en cours...
                </span>
            </button>

            <div class="container" style="text-align: center; margin-top: 10px;">
                <a routerLink="/connexion" style="font-size: 13px; color: #086AD8;">
                    <i class="fa fa-arrow-left me-1"></i>Retour à la connexion
                </a>
            </div>
        </form>
    </div>
</div>
</body>
