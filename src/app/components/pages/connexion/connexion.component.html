<section class="auth-section d-flex align-items-center min-vh-100 py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <div class="card shadow border-0 rounded-4">
          <div class="card-body p-4 p-md-5">

            <!-- Logo / Titre -->
            <div class="text-center mb-4">
              <h4 class="fw-bold text-primary mb-1">MaliDevConnect</h4>
              <p class="text-muted small">Connectez-vous à votre espace</p>
            </div>

            <form #f="ngForm" (ngSubmit)="f.form.valid && seConnecter()" novalidate>

              <!-- Email ou Téléphone -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Numéro ou Email <span class="text-danger">*</span></label>
                <input class="form-control form-control-lg" type="text" name="telephoneOrEmail"
                  [(ngModel)]="form.telephoneOrEmail" required #telephoneOrEmail="ngModel"
                  [ngClass]="{'is-invalid': f.submitted && telephoneOrEmail.errors}"
                  placeholder="Votre numéro ou email" />
                <div class="invalid-feedback" *ngIf="telephoneOrEmail.errors && f.submitted">
                  <span *ngIf="telephoneOrEmail.errors['required']">Champ obligatoire</span>
                </div>
              </div>

              <!-- Mot de passe -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Mot de passe <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input class="form-control form-control-lg" [type]="Toggledata ? 'password' : 'text'"
                    name="password" [(ngModel)]="form.password" required minlength="6" #password="ngModel"
                    [ngClass]="{'is-invalid': f.submitted && password.errors}"
                    placeholder="Votre mot de passe" />
                  <button class="btn btn-outline-secondary" type="button" (click)="iconLogle()">
                    <i class="fa" [ngClass]="Toggledata ? 'fa-eye-slash' : 'fa-eye'"></i>
                  </button>
                  <div class="invalid-feedback" *ngIf="password.errors && f.submitted">
                    <span *ngIf="password.errors['required']">Mot de passe obligatoire</span>
                    <span *ngIf="password.errors['minlength']">Minimum 6 caractères</span>
                  </div>
                </div>
              </div>

              <!-- Mot de passe oublié -->
              <div class="d-flex justify-content-end mb-3">
                <a routerLink="/mdp-oublie" class="text-primary text-decoration-none small">Mot de passe oublié ?</a>
              </div>

              <!-- Alerte erreur -->
              <div class="alert alert-danger py-2 small" *ngIf="isLoginFailed && errorMessage">
                {{ errorMessage }}
              </div>

              <!-- Bouton connexion -->
              <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3">
                Se connecter
              </button>

            </form>

            <!-- Séparateur Google -->
            <div class="d-flex align-items-center gap-2 my-3">
              <hr class="flex-grow-1 m-0">
              <span class="text-muted small px-1">ou</span>
              <hr class="flex-grow-1 m-0">
            </div>

            <!-- Bouton Google -->
            <div class="d-flex justify-content-center mb-3">
              <div id="google-btn-connexion"></div>
            </div>

            <hr class="my-3">

            <p class="text-center text-muted small mb-0">
              Pas encore de compte ?
              <a routerLink="/inscription" class="text-primary fw-semibold text-decoration-none">S'inscrire</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
